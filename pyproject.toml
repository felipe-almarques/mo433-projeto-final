[project]
name = "mo433-projeto-final"
version = "0.1.0"
description = "MO433 - Distilling Unsupervised Representations into Small Models (DINO ViT-S/16 -> convnet vs VICReg)"
authors = [
    {name = "felipealmarques",email = "felipealmarques02@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
# PyTorch/torchvision com CUDA devem ser instalados antes, a partir do índice do PyTorch
# (ver README): pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "lightly>=1.5",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.scripts]
mo433 = "mo433_projeto_final.__main__:main"

[tool.poetry]
packages = [{include = "mo433_projeto_final", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
